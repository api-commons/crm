openapi: 3.1.0
info:
  title: Customer Relationship Management (API Commons)
  version: '2026-11-10'
  description: 'The common Customer Relationship Management interface, distilled from the harvested OpenAPI of 134
    providers in the APIs.io catalog. Not a product: no one serves this API. It is the shape the market already
    shares, measured, so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
