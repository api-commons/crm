excluded:
  company:
    activecampaign: /profiles/{id}/accounts are AI-customization profile accounts
    drippay: /integrations/quickbooks/accounts are accounting ledger accounts
    entergram: /accounts are connected messaging-channel accounts
    frontline: /channels/instagram/accounts are social channel accounts
    givebutter: /sso/v1/account is the signed-in user's own organization
    getresponse: /accounts is the API user's own account settings
    vaultre: /account is the API user's own agency account
    close: /organization/{id} is the Close tenant organization
    agorapulse: /core/organizations are the social-media tool's tenant organizations
    thanx: /api/account is a loyalty member's own account
  contact:
    marketo: /subscriptions/{id}/persons is a dedupe subscription, not a person resource
    lever-co: recruiting (ATS) contacts of candidates
    keller-williams: /listings/orgs/{id}/people are real-estate agents
    servicetitan: /customers/{id}/contacts are contact methods (type + value)
  deal:
    drippay: /integrations/salesforce/{id}/sync/opportunities is a sync trigger
    lever-co: /opportunities are recruiting candidates in a hiring pipeline
  activity:
    act: /api/attachments/activities are attachments
    close: /custom_field/activity is a custom-field definition
  task:
    holded: /projects/{id}/tasks are project-management tasks
  note:
    agorapulse: publishing-calendar notes in a social-media tool
    lever-co: recruiting notes on candidates
  pipeline:
    act: /opportunities/analytics/pipeline is a report
